<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preventivatore Tarkett</title>
<link rel="stylesheet" href="style.css?v=20261022-3">
</head>
<body>

<header class="topbar no-print">
  <h1>Preventivatore Tarkett <small style="font-size:11px;opacity:.75">v2026.10.22.3</small></h1>
  <nav>
    <button id="tab-nuovo" class="tab active">Nuovo preventivo</button>
    <button id="tab-clienti" class="tab">Clienti</button>
    <button id="tab-archivio" class="tab">Archivio</button>
  </nav>
  <div style="display:flex; gap:8px;">
    <button id="btn-project">Protezione Project</button>
    <button id="btn-importa-catalogo">Importa Catalogo</button>
    <input type="file" id="file-importa-catalogo" accept=".csv,text/csv" style="display:none;">
    <button id="btn-esporta">⬇ Esporta archivio</button>
    <button id="btn-importa">⬆ Importa archivio</button>
    <input type="file" id="file-importa" accept="application/json" style="display:none;">
  </div>
</header>

<main id="app"></main>

<script src="data.js?v=20261022-3"></script>
<script src="calc.js?v=20261022-3"></script>
<script src="storage.js?v=20261022-3"></script>
<script src="app.js?v=20261022-3"></script>
<script>
  function aggiornaPulsanteProject() {
    const btn = document.getElementById('btn-project');
    if (!pinProjectConfigurato()) btn.textContent = 'Imposta PIN Project';
    else if (projectSbloccato()) btn.textContent = 'Blocca Project';
    else btn.textContent = 'Sblocca Project';
  }
  document.getElementById('btn-project').onclick = () => {
    if (!pinProjectConfigurato()) {
      impostaPinProject();
    } else if (projectSbloccato()) {
      bloccaProject();
    } else {
      sbloccaProject();
    }
    aggiornaPulsanteProject();
    render();
  };
  aggiornaPulsanteProject();
  document.getElementById('btn-importa-catalogo').onclick = () =>
    document.getElementById('file-importa-catalogo').click();
  document.getElementById('file-importa-catalogo').onchange = async (e) => {
    const file = e.target.files[0];
    if (file) {
      try {
        const esito = await importaCatalogoCSV(file);
        alert(`Catalogo aggiornato.\nArticoli importati: ${esito.articoli}`);
        state.view = 'nuovo';
        render();
      } catch (errore) {
        alert(`Impossibile importare il Catalogo.\n${errore.message}`);
      }
    }
    e.target.value = '';
  };
  document.getElementById('btn-esporta').onclick = esportaBackup;
  document.getElementById('btn-importa').onclick = () => document.getElementById('file-importa').click();
  document.getElementById('file-importa').onchange = async (e) => {
    const file = e.target.files[0];
    if (file) {
      const esito = await importaBackup(file);
      if (esito) {
        alert(`Backup unito ai dati esistenti.\nPreventivi nuovi: ${esito.aggiunti}\nPreventivi aggiornati: ${esito.aggiornati}`);
        state.view = 'archivio'; render();
      }
    }
    e.target.value = '';
  };
</script>
</body>
</html>
